name: Обновление данных

on:
  schedule:
    - cron: "5 6 * * *"   # 09:05 по Москве
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Скачать и свести данные
        run: python scripts/build_data.py
      - name: Сохранить данные в репозиторий
        run: |
          git config user.name "ai-rating bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache site/data
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "Данные за $(TZ=Europe/Moscow date +%F)"
            git push
          fi
