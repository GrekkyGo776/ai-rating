name: Обновление данных

on:
  schedule:
    - cron: "17 2 * * *"  # 05:17 МСК — вне перегруженного окна 06:00 UTC, к 09:05 МСК данные уже свежие
    - cron: "47 4 * * *"  # 07:47 МСК — запасной прогон, если на первом не всё загрузилось
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - "scripts/build_data.py"
      - "scripts/contra_data.py"
      - "config/*.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Проверить каталог и импорт результатов ЕГЭ
        run: |
          python -m unittest discover -s scripts
          python -m unittest discover -s tests
      - name: Скачать и свести данные
        env:
          BACKUP_RUN: ${{ github.event.schedule == '47 4 * * *' }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          snapshot = json.loads(Path("site/data/models.json").read_text(encoding="utf-8"))
          today = datetime.now(ZoneInfo("Europe/Moscow")).date().isoformat()
          sources = snapshot.get("status", {})
          all_current = bool(sources) and all(
              item.get("ok") and not item.get("cached")
              and str(item.get("fetched", "")).startswith(today)
              for item in sources.values()
          )
          if os.environ.get("BACKUP_RUN") == "true" and all_current:
              print("Все источники уже обновлены сегодня.")
          else:
              subprocess.run([sys.executable, "scripts/build_data.py"], check=True)
          PY
      - name: Сохранить данные в репозиторий
        run: |
          git config user.name "ai-rating bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache site/data
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "Данные за $(TZ=Europe/Moscow date +%F)"
            git push
          fi
